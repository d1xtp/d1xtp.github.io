<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Amethyst Path Ayx9688: Hex Solver</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
        :root {
            --bg: #030305;
            --surface: #0d0d12;
            --primary: #c270ff; /* Аметистовый фиолетовый */
            --secondary: #6e3eff; 
            --border: #4a4a55; /* Контрастные границы */
            --grid-passive: #3a3a45; /* Видимая сетка */
            --dot: #666677;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: white;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ШАПКА В МАГИЧЕСКОМ СТИЛЕ */
        header {
            background: var(--surface);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 15px rgba(194, 112, 255, 0.2);
            z-index: 10;
        }

        .logo {
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        .controls { display: flex; gap: 8px; align-items: center; }
        .control-group { background: #1a1a25; padding: 4px 10px; border-radius: 8px; border: 1px solid #333; }
        .control-group label { font-size: 8px; display: block; color: #aaa; text-transform: uppercase; margin-bottom: 2px; }
        .val-row { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: bold; color: var(--primary); }
        input[type="range"] { width: 55px; accent-color: var(--primary); }

        .btn-group { display: flex; gap: 6px; margin-left: auto; }
        button {
            border: none; padding: 10px 14px; border-radius: 8px;
            font-size: 10px; font-weight: 900; cursor: pointer; text-transform: uppercase;
            transition: 0.2s;
        }
        .btn-solve { background: var(--primary); color: #000; box-shadow: 0 0 10px rgba(194,112,255,0.4); }
        .btn-clear { background: #2a1a1a; color: #ff5555; }
        button:active { transform: scale(0.95); }

        main { flex: 1; display: flex; flex-direction: column; min-height: 0; }

        /* ОГРОМНАЯ СЕТКА */
        #canvas-wrap {
            flex: 4; 
            position: relative;
            background: radial-gradient(circle at center, #0a0a15 0%, #000 100%);
            overflow: hidden;
        }

        /* РЕЗУЛЬТАТЫ ПО 2 В РЯД */
        #results-area {
            flex: 1.3;
            background: var(--surface);
            border-top: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            min-height: 160px;
        }

        .res-info { padding: 6px 15px; font-size: 10px; color: #888; border-bottom: 1px solid #222; display: flex; justify-content: space-between; }
        .res-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; overflow-y: auto; }

        .card { background: #050508; border: 1px solid var(--border); border-radius: 10px; padding: 4px; position: relative; }
        .card:active { border-color: var(--primary); }
        .card canvas { width: 100%; aspect-ratio: 1.6; border-radius: 6px; }

        @media (min-width: 1000px) {
            main { flex-direction: row; }
            #results-area { width: 300px; height: 100%; border-top: none; border-left: 2px solid var(--border); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
    </style>
</head>
<body>

<header>
    <div class="logo">Amethyst Path Ayx9688</div> <!-- НОВОЕ НАЗВАНИЕ ЗДЕСЬ -->
    
    <div class="controls">
        <div class="control-group">
            <label>Масштаб</label>
            <div class="val-row">
                <input type="range" id="size-in" min="40" max="150" value="85">
                <span id="size-val">85</span>
            </div>
        </div>
        <div class="control-group">
            <label>Скорость</label>
            <div class="val-row">
                <input type="range" id="speed-in" min="20" max="1000" step="20" value="250">
                <span id="speed-val">250</span>
            </div>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-clear" onclick="clearField()">Сброс</button>
        <button class="btn-solve" onclick="analyze()">Анализ</button>
    </div>
</header>

<main>
    <div id="canvas-wrap">
        <canvas id="main-canvas"></canvas>
    </div>

    <div id="results-area">
        <div class="res-info">
            <span>НАЙДЕННЫЕ ПУТИ: <b id="count-val" style="color:var(--primary)">0</b></span>
            <span>2 В РЯД</span>
        </div>
        <div class="res-grid" id="grid"></div>
    </div>
</main>

<script>
    const canvas = document.getElementById('main-canvas'), ctx = canvas.getContext('2d');
    const wrap = document.getElementById('canvas-wrap'), grid = document.getElementById('grid');
    const sizeIn = document.getElementById('size-in'), sizeVal = document.getElementById('size-val');
    const speedIn = document.getElementById('speed-in'), speedVal = document.getElementById('speed-val');
    const countVal = document.getElementById('count-val');

    let spacing = 85, vertices = [], edges = new Map(), selected = new Set();

    function init() {
        window.onresize = resize;
        const trigger = (e) => {
            const p = e.touches ? e.touches[0] : e;
            toggleEdge(p.clientX, p.clientY);
        };
        canvas.addEventListener('mousedown', trigger);
        canvas.addEventListener('touchstart', (e) => { trigger(e); e.preventDefault(); }, {passive:false});

        sizeIn.oninput = (e) => { spacing = parseInt(e.target.value); sizeVal.innerText = spacing; clearField(); };
        speedIn.oninput = (e) => speedVal.innerText = e.target.value;

        resize();
        render();
    }

    function resize() {
        canvas.width = wrap.clientWidth; canvas.height = wrap.clientHeight;
        genGrid();
    }

    function genGrid() {
        vertices = []; edges.clear();
        const sY = spacing * 0.866;
        for (let r = 0; r < (canvas.height/sY)+1; r++) {
            for (let c = 0; c < (canvas.width/spacing)+1; c++) {
                vertices.push({ x: c*spacing + (r%2 ? spacing/2 : 0), y: r*sY, id: `v${r}_${c}` });
            }
        }
        vertices.forEach(v => {
            vertices.forEach(v2 => {
                const d = Math.hypot(v.x-v2.x, v.y-v2.y);
                if (d > spacing-2 && d < spacing+2) {
                    const id = [v.id, v2.id].sort().join('--');
                    if (!edges.has(id)) edges.set(id, {v1:v, v2:v2});
                }
            });
        });
    }

    function toggleEdge(cx, cy) {
        const r = canvas.getBoundingClientRect();
        const x = cx-r.left, y = cy-r.top;
        let best = null, minDist = spacing / 2.2;
        edges.forEach((e, id) => {
            const d = distToSeg(x,y, e.v1.x, e.v1.y, e.v2.x, e.v2.y);
            if (d < minDist) { minDist = d; best = id; }
        });
        if (best) {
            if (selected.has(best)) selected.delete(best);
            else selected.add(best);
        }
    }

    function distToSeg(px,py, x1,y1, x2,y2) {
        const l2 = Math.pow(x1-x2,2) + Math.pow(y1-y2,2);
        let t = Math.max(0, Math.min(1, ((px-x1)*(x2-x1) + (py-y1)*(y2-y1)) / l2));
        return Math.hypot(px-(x1+t*(x2-x1)), py-(y1+t*(y2-y1)));
    }

    function analyze() {
        if (!selected.size) return;
        grid.innerHTML = '';
        const adj = new Map();
        selected.forEach(id => {
            const e = edges.get(id);
            if(!adj.has(e.v1.id)) adj.set(e.v1.id, []);
            if(!adj.has(e.v2.id)) adj.set(e.v2.id, []);
            adj.get(e.v1.id).push({to:e.v2.id, id});
            adj.get(e.v2.id).push({to:e.v1.id, id});
        });

        const odd = Array.from(adj.keys()).filter(n => adj.get(n).length % 2 !== 0);
        const starts = (odd.length === 0) ? Array.from(adj.keys()) : (odd.length === 2 ? odd : []);

        const res = [];
        const find = (curr, vis, path) => {
            if (vis.size === selected.size) { res.push([...path]); return; }
            if (res.length >= 40) return;
            (adj.get(curr)||[]).forEach(e => {
                if(!vis.has(e.id)) {
                    vis.add(e.id); path.push({f:curr, t:e.to});
                    find(e.to, vis, path);
                    path.pop(); vis.delete(e.id);
                }
            });
        };
        starts.forEach(n => { if(res.length < 40) find(n, new Set(), []); });
        countVal.innerText = res.length;

        res.forEach(path => {
            const card = document.createElement('div'); card.className = 'card';
            const c = document.createElement('canvas'); c.width = 160; c.height = 100;
            card.appendChild(c); card.onclick = () => animate(path, c);
            grid.appendChild(card); drawCard(path, c);
        });
    }

    function drawCard(path, c) {
        const x = c.getContext('2d'), b = getB(path), s = 70 / Math.max(b.w, b.h);
        x.strokeStyle = '#333344'; x.lineWidth = 2.5; x.lineCap = 'round';
        path.forEach(p => {
            const v1 = vertices.find(v => v.id === p.f), v2 = vertices.find(v => v.id === p.t);
            x.beginPath(); x.moveTo((v1.x-b.x)*s+45, (v1.y-b.y)*s+15);
            x.lineTo((v2.x-b.x)*s+45, (v2.y-b.y)*s+15); x.stroke();
        });
    }

    function animate(path, c) {
        const x = c.getContext('2d'), b = getB(path), s = 70 / Math.max(b.w, b.h), spd = parseInt(speedIn.value);
        let i = 0;
        const t = setInterval(() => {
            x.clearRect(0,0,160,100); drawCard(path, c);
            for(let j=0; j<=i; j++) {
                const v1 = vertices.find(v => v.id === path[j].f), v2 = vertices.find(v => v.id === path[j].t);
                x.strokeStyle = '#c270ff'; x.lineWidth = 4;
                x.beginPath(); x.moveTo((v1.x-b.x)*s+45, (v1.y-b.y)*s+15);
                x.lineTo((v2.x-b.x)*s+45, (v2.y-b.y)*s+15); x.stroke();
                if(j===0) dot(x, (v1.x-b.x)*s+45, (v1.y-b.y)*s+15, '#00ffcc');
                if(j===i) dot(x, (v2.x-b.x)*s+45, (v2.y-b.y)*s+15, '#ff3366');
            }
            if(++i >= path.length) clearInterval(t);
        }, spd);
    }

    function dot(x,px,py,c) { x.fillStyle=c; x.beginPath(); x.arc(px,py,3,0,7); x.fill(); }
    function getB(path) {
        let x0=9999,y0=9999,x1=0,y1=0;
        path.forEach(p => {
            const v = vertices.find(v => v.id === p.f);
            x0=Math.min(x0, v.x); y0=Math.min(y0, v.y); x1=Math.max(x1, v.x); y1=Math.max(y1, v.y);
        });
        return {x:x0, y:y0, w:x1-x0||1, h:y1-y0||1};
    }

    function clearField() { selected.clear(); grid.innerHTML = ''; countVal.innerText = '0'; resize(); }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        edges.forEach((e, id) => {
            const s = selected.has(id);
            ctx.strokeStyle = s ? '#c270ff' : '#333345';
            ctx.lineWidth = s ? 5 : 2.5;
            ctx.beginPath(); ctx.moveTo(e.v1.x, e.v1.y); ctx.lineTo(e.v2.x, e.v2.y); ctx.stroke();
        });
        vertices.forEach(v => {
            ctx.fillStyle = '#666677';
            ctx.beginPath(); ctx.arc(v.x, v.y, 3.5, 0, 7); ctx.fill();
        });
        requestAnimationFrame(render);
    }

    init();
</script>
</body>
</html>
